name: PWA Install and Update Fix 4.1.5
on:
  push:
    paths:
      - '.github/workflows/update-4.1.5.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v4.1.5 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')

          # Version cache-busted resources.
          p=root/'index.html'; s=p.read_text()
          s=s.replace('data-app-version="4.1.4"','data-app-version="4.1.5"')
          s=s.replace('?v=4.1.4','?v=4.1.5')
          p.write_text(s)

          # Chrome-friendly manifest: explicit standard PNG icons.
          p=root/'manifest.webmanifest'; data=json.loads(p.read_text())
          for icon in data.get('icons',[]):
              icon['purpose']='any'
          data['prefer_related_applications']=False
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          # One SW owner only: remove legacy registration from app.js.
          p=root/'js/app.js'; s=p.read_text()
          legacy='''  function registerServiceWorker() {\n    if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) return;\n    navigator.serviceWorker.register("./sw.js").then((registration) => registration.update()).catch(() => {\n      // Offline install is optional; the app remains fully usable online or from a local folder.\n    });\n  }\n\n'''
          s=s.replace(legacy,'')
          s=s.replace('    registerServiceWorker();\n','')
          # Improve Chrome fallback wording without pretending we can force the prompt.
          s=s.replace('Chrome todavía no ha ofrecido el diálogo automático para esta sesión.','Chrome no ha ofrecido todavía el diálogo nativo. La app comprobará el Service Worker y el manifest, pero Chrome decide cuándo habilita el prompt de instalación.')
          s=s.replace('<li>Busca el icono de instalación en la barra de direcciones o abre el menú ⋮.</li><li>Elige Instalar Caminos Malditos Sangrientos.</li><li>Si la opción no aparece, recarga una vez y comprueba que estás usando HTTPS.</li>','<li>Espera a que termine la primera carga y recarga una vez si acabas de actualizar.</li><li>Busca el icono de instalación en la barra de direcciones o abre ⋮ → Transmitir, guardar y compartir → Instalar página como aplicación.</li><li>Si no aparece, abre chrome://apps para comprobar que no exista ya una instalación anterior y vuelve a esta URL HTTPS.</li>')
          p.write_text(s)

          # Robust single registration + no repeated banner for same worker.
          p=root/'js/update.js'; s=p.read_text()
          s='''(function () {\n  "use strict";\n  const VERSION = "4.1.5";\n  const DISMISSED_KEY = `abyss404:update-dismissed:${VERSION}`;\n  let registration = null;\n  let waitingWorker = null;\n  let applying = false;\n\n  function banner() { return document.getElementById("update-banner"); }\n  function currentWorkerUrl() { return navigator.serviceWorker.controller ? navigator.serviceWorker.controller.scriptURL : ""; }\n  function wasDismissed(worker) {\n    try { return sessionStorage.getItem(DISMISSED_KEY) === (worker && worker.scriptURL || ""); } catch (_) { return false; }\n  }\n  function show(reg, worker) {\n    if (!navigator.serviceWorker.controller || !worker) return;\n    if (worker.scriptURL === currentWorkerUrl() || wasDismissed(worker)) return;\n    registration = reg;\n    waitingWorker = worker;\n    const el = banner();\n    if (el) el.hidden = false;\n  }\n  function hide() {\n    const worker = waitingWorker || (registration && registration.waiting);\n    try { if (worker) sessionStorage.setItem(DISMISSED_KEY, worker.scriptURL); } catch (_) {}\n    const el = banner();\n    if (el) el.hidden = true;\n  }\n  function apply() {\n    const worker = waitingWorker || (registration && registration.waiting);\n    if (!worker || worker.scriptURL === currentWorkerUrl()) { const el=banner(); if (el) el.hidden=true; return; }\n    try { sessionStorage.removeItem(DISMISSED_KEY); } catch (_) {}\n    applying = true;\n    worker.postMessage({ type: "SKIP_WAITING" });\n  }\n  function bind() {\n    const applyButton = document.getElementById("apply-update");\n    const dismissButton = document.getElementById("dismiss-update");\n    if (applyButton) applyButton.addEventListener("click", apply);\n    if (dismissButton) dismissButton.addEventListener("click", hide);\n  }\n  async function register() {\n    if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) return;\n    navigator.serviceWorker.addEventListener("controllerchange", () => {\n      const el=banner(); if (el) el.hidden=true;\n      if (applying) location.reload();\n    });\n    try {\n      const reg = await navigator.serviceWorker.register(`./sw.js?v=${VERSION}`, { updateViaCache: "none" });\n      registration = reg;\n      if (reg.waiting) show(reg, reg.waiting);\n      reg.addEventListener("updatefound", () => {\n        const worker = reg.installing;\n        if (!worker) return;\n        worker.addEventListener("statechange", () => {\n          if (worker.state === "installed" && navigator.serviceWorker.controller) show(reg, worker);\n        });\n      });\n      await navigator.serviceWorker.ready;\n      reg.update().catch(() => {});\n    } catch (_) { /* Online mode remains available. */ }\n  }\n  window.addEventListener("DOMContentLoaded", () => { bind(); register(); });\n})();\n'''
          p.write_text(s)

          # Service Worker version and resources.
          p=root/'sw.js'; s=p.read_text().replace('abyss404-v4.1.4','abyss404-v4.1.5').replace('?v=4.1.4','?v=4.1.5')
          p.write_text(s)

          # Package and tests.
          p=root/'package.json'; data=json.loads(p.read_text()); data['version']='4.1.5'
          script=data['scripts']['test']
          if 'tests/pwa-single-owner.test.js' not in script:
              script=script.replace('node tests/update-flow.test.js &&','node tests/update-flow.test.js && node tests/pwa-single-owner.test.js &&')
          data['scripts']['test']=script
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          for name in ['install-flow.test.js','sw-navigation.test.js','update-flow.test.js']:
              p=root/'tests'/name; st=p.read_text().replace('4.1.4','4.1.5'); p.write_text(st)
          (root/'tests/pwa-single-owner.test.js').write_text('''"use strict";\nconst fs=require("fs"),path=require("path"),root=path.resolve(__dirname,"..");\nconst app=fs.readFileSync(path.join(root,"js/app.js"),"utf8"),up=fs.readFileSync(path.join(root,"js/update.js"),"utf8"),manifest=JSON.parse(fs.readFileSync(path.join(root,"manifest.webmanifest"),"utf8"));\nconst checks=[[!app.includes('navigator.serviceWorker.register("./sw.js")'),"app.js no registra un segundo Service Worker"],[!app.includes("registerServiceWorker();"),"boot no invoca registro legacy"],[(up.match(/serviceWorker\.register\(/g)||[]).length===1,"update.js contiene un único registro"],[up.includes('updateViaCache: "none"'),"actualización ignora caché HTTP del SW"],[up.includes('worker.scriptURL === currentWorkerUrl()'),"no avisa si waiting y controller son el mismo worker"],[up.includes("DISMISSED_KEY"),"evita repetir aviso descartado en la sesión"],[up.includes("navigator.serviceWorker.ready"),"espera a que PWA esté preparada"],[manifest.icons.some(i=>i.sizes==="192x192"&&i.purpose==="any"),"icono PNG 192 estándar"],[manifest.icons.some(i=>i.sizes==="512x512"&&i.purpose==="any"),"icono PNG 512 estándar"],[manifest.display==="standalone","display standalone"],[manifest.start_url==="./"&&manifest.scope==="./","start_url y scope coherentes"]];\nconst fail=checks.filter(([ok])=>!ok);if(fail.length){fail.forEach(([,x])=>console.error("✗ "+x));process.exit(1)}console.log(`✓ PWA single-owner e instalabilidad verificados (${checks.length} comprobaciones)`);\n''')

          # Make validator ignore VCS/workflow internals if not already fixed.
          p=root/'tests/validate-project.js'; s=p.read_text()
          s=s.replace('if (entry.name === "node_modules") continue;','if (["node_modules", ".git", ".github"].includes(entry.name)) continue;')
          p.write_text(s)

          # Docs.
          p=root/'README.md'; s=p.read_text().replace('**Versión 4.1.4 — Stable / Definitive · Update Reliability**','**Versión 4.1.5 — Stable / Definitive · PWA Install & Update Fix**').replace('abyss404-v4.1.4','abyss404-v4.1.5')
          if '### PWA Install & Update Fix 4.1.5' not in s:
              marker='### Actualización fiable 4.1.4'
              section='### PWA Install & Update Fix 4.1.5\n\n- Un único módulo registra y gestiona el Service Worker; eliminado el registro duplicado que podía alternar URLs y repetir avisos.\n- El aviso de actualización solo aparece si el worker en espera es realmente distinto del controlador actual.\n- Descartar el aviso evita que reaparezca para el mismo worker durante esa sesión.\n- Registro con `updateViaCache: "none"` y espera explícita a `serviceWorker.ready`.\n- Manifest simplificado para Chrome PC con iconos PNG 192/512 de propósito estándar `any`.\n- Nuevo test automático de propiedad única del Service Worker e instalabilidad base.\n\n'
              s=s.replace(marker,section+marker)
          p.write_text(s)
          p=root/'CHANGELOG.md'; s=p.read_text()
          if '## 4.1.5 — PWA Install & Update Fix' not in s:
              s=s.replace('## 4.1.4','## 4.1.5 — PWA Install & Update Fix\n\n- Eliminado el registro duplicado del Service Worker entre `app.js` y `update.js`.\n- Evitado el aviso repetitivo cuando el worker en espera coincide con el controlador actual.\n- Añadida supresión por sesión al descartar una actualización.\n- Registro con `updateViaCache: none` y espera de `serviceWorker.ready`.\n- Manifest ajustado para Chrome PC con iconos PNG estándar 192/512.\n- Nuevo test `pwa-single-owner.test.js`.\n- Caché `abyss404-v4.1.5`.\n\n## 4.1.4',1)
          p.write_text(s)
          p=root/'AUDIT-REPORT.md'; s=p.read_text().replace('v4.1.4','v4.1.5')
          if '## PWA Install & Update Fix 4.1.5' not in s:
              s+='\n\n## PWA Install & Update Fix 4.1.5\n\nSe elimina el doble registro del Service Worker y se endurece el flujo de actualización/instalación para Chrome PC.\n'
          p.write_text(s)
          PY
      - name: Test release
        run: npm test
      - name: Commit release
        shell: bash
        run: |
          rm -f .github/workflows/update-4.1.5.yml
          git config user.name "Universe 404 Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: PWA install and update flow v4.1.5"
          git push
