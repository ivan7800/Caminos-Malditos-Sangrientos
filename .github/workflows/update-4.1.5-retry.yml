name: Retry PWA Fix 4.1.5
on:
  push:
    paths:
      - '.github/workflows/update-4.1.5-retry.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse 4.1.5 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/update-4.1.5.yml').read_text()
          start=src.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=src.index("\n          PY\n",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end].splitlines())
          exec(compile(code,'migration','exec'))
          PY
      - name: Align validator with dedicated update module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/validate-project.js'); s=p.read_text()
          s=s.replace('const appJs = fs.readFileSync(path.join(root, "js/app.js"), "utf8");','const appJs = fs.readFileSync(path.join(root, "js/app.js"), "utf8");\nconst updateJs = fs.readFileSync(path.join(root, "js/update.js"), "utf8");')
          s=s.replace('assert.match(appJs, /registration\\.update\\(\\)/, "El Service Worker debe comprobar actualizaciones");','assert.match(updateJs, /reg\\.update\\(\\)/, "El módulo de actualización debe comprobar actualizaciones");')
          p.write_text(s)
          PY
      - name: Test release
        run: npm test
      - name: Commit release
        run: |
          rm -f .github/workflows/update-4.1.5.yml .github/workflows/update-4.1.5-retry.yml
          git config user.name "Universe 404 Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: PWA install and update flow v4.1.5"
          git push
