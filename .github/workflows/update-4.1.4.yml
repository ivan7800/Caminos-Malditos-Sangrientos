name: Update PWA to 4.1.4
on:
  push:
    paths:
      - '.github/workflows/update-4.1.4.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v4.1.4 update reliability patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')

          p=root/'index.html'; s=p.read_text()
          s=s.replace('<body>', '<body data-app-version="4.1.4">',1)
          s=s.replace('href="manifest.webmanifest"','href="manifest.webmanifest?v=4.1.4"')
          s=s.replace('href="styles.css"','href="styles.css?v=4.1.4"')
          if 'update.css?v=4.1.4' not in s:
              s=s.replace('<link rel="stylesheet" href="styles.css?v=4.1.4">','<link rel="stylesheet" href="styles.css?v=4.1.4">\n  <link rel="stylesheet" href="update.css?v=4.1.4">')
          for a in ['scenarios','endings','engine','storage','app']:
              s=s.replace(f'src="js/{a}.js"',f'src="js/{a}.js?v=4.1.4"')
          needle='  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>\n\n'
          banner='''  <aside class="update-banner" id="update-banner" role="status" aria-live="polite" aria-labelledby="update-title" hidden>\n    <div>\n      <strong id="update-title">Nueva versión disponible</strong>\n      <span>Hay una actualización lista. Tu partida local se conserva.</span>\n    </div>\n    <button class="btn btn--primary" id="apply-update" type="button">Actualizar ahora</button>\n    <button class="icon-btn update-banner__close" id="dismiss-update" type="button" aria-label="Ocultar aviso de actualización">×</button>\n  </aside>\n\n'''
          if 'id="update-banner"' not in s:
              s=s.replace(needle,needle+banner)
          if 'js/update.js?v=4.1.4' not in s:
              s=s.replace('  <script src="js/scenarios.js?v=4.1.4" defer></script>', '  <script src="js/update.js?v=4.1.4" defer></script>\n  <script src="js/scenarios.js?v=4.1.4" defer></script>')
          p.write_text(s)

          (root/'js/update.js').write_text('''(function () {\n  "use strict";\n  const VERSION = "4.1.4";\n  let registration = null;\n  let waitingWorker = null;\n  let applying = false;\n  function banner() { return document.getElementById("update-banner"); }\n  function show(reg, worker) { if (!navigator.serviceWorker.controller || !worker) return; registration = reg; waitingWorker = worker; const el = banner(); if (el) el.hidden = false; }\n  function hide() { const el = banner(); if (el) el.hidden = true; }\n  function apply() { const worker = waitingWorker || (registration && registration.waiting); if (!worker) return location.reload(); applying = true; worker.postMessage({ type: "SKIP_WAITING" }); }\n  function bind() { const applyButton=document.getElementById("apply-update"), dismissButton=document.getElementById("dismiss-update"); if (applyButton) applyButton.addEventListener("click", apply); if (dismissButton) dismissButton.addEventListener("click", hide); }\n  async function register() {\n    if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) return;\n    navigator.serviceWorker.addEventListener("controllerchange", () => { if (applying) location.reload(); else hide(); });\n    try {\n      const reg = await navigator.serviceWorker.register(`./sw.js?v=${VERSION}`); registration = reg; if (reg.waiting) show(reg, reg.waiting);\n      reg.addEventListener("updatefound", () => { const worker=reg.installing; if (!worker) return; worker.addEventListener("statechange", () => { if (worker.state === "installed" && navigator.serviceWorker.controller) show(reg, worker); }); });\n      reg.update().catch(() => {});\n    } catch (_) {}\n  }\n  window.addEventListener("DOMContentLoaded", () => { bind(); register(); });\n})();\n''')
          (root/'update.css').write_text('''.update-banner{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:1200;width:min(680px,calc(100% - 28px));transform:translateX(-50%);display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px;padding:14px 14px 14px 18px;border:1px solid rgba(194,49,49,.6);border-radius:16px;background:rgba(13,9,9,.96);box-shadow:0 18px 60px rgba(0,0,0,.48);backdrop-filter:blur(18px)}\n.update-banner[hidden]{display:none!important}.update-banner div{display:grid;gap:3px}.update-banner strong{color:#f4eee7;font-size:.98rem}.update-banner span{color:#b9ada5;font-size:.84rem;line-height:1.35}.update-banner .btn{white-space:nowrap}@media(max-width:620px){.update-banner{grid-template-columns:1fr auto;gap:10px;padding:13px}.update-banner .btn{grid-column:1/-1;width:100%}.update-banner__close{grid-column:2;grid-row:1}}\n''')

          p=root/'sw.js'; s=p.read_text().replace('abyss404-v4.1.3','abyss404-v4.1.4')
          for a in ['styles.css','manifest.webmanifest','js/scenarios.js','js/endings.js','js/engine.js','js/storage.js','js/app.js']:
              s=s.replace(f'"./{a}"',f'"./{a}?v=4.1.4"')
          if '"./update.css?v=4.1.4"' not in s: s=s.replace('  "./styles.css?v=4.1.4",','  "./styles.css?v=4.1.4",\n  "./update.css?v=4.1.4",')
          if '"./js/update.js?v=4.1.4"' not in s: s=s.replace('  "./js/scenarios.js?v=4.1.4",','  "./js/update.js?v=4.1.4",\n  "./js/scenarios.js?v=4.1.4",')
          s=s.replace('caches.open(CACHE_VERSION).then((cache) => cache.addAll(APP_SHELL)).then(() => self.skipWaiting())','caches.open(CACHE_VERSION).then((cache) => cache.addAll(APP_SHELL))')
          if 'event.data.type === "SKIP_WAITING"' not in s:
              s=s.replace('self.addEventListener("fetch", (event) => {','self.addEventListener("message", (event) => {\n  if (event.data && event.data.type === "SKIP_WAITING") self.skipWaiting();\n});\n\nself.addEventListener("fetch", (event) => {')
          p.write_text(s)

          p=root/'package.json'; s=p.read_text().replace('"version": "4.1.3"','"version": "4.1.4"')
          if 'tests/update-flow.test.js' not in s: s=s.replace('node tests/sw-navigation.test.js && node tests/validate-project.js','node tests/sw-navigation.test.js && node tests/update-flow.test.js && node tests/validate-project.js')
          p.write_text(s)

          for name in ['install-flow.test.js','sw-navigation.test.js']:
              p=root/'tests'/name; p.write_text(p.read_text().replace('abyss404-v4.1.3','abyss404-v4.1.4').replace('v4.1.3','v4.1.4'))
          p=root/'tests/validate-project.js'; s=p.read_text()
          old='shellMatches.filter((file) => file !== "").forEach((file) => assert.ok(fs.existsSync(path.join(root, file)), `El Service Worker referencia un archivo inexistente: ${file}`));'
          new='shellMatches.filter((file) => file !== "").forEach((file) => { const diskPath = file.split(/[?#]/, 1)[0]; assert.ok(fs.existsSync(path.join(root, diskPath)), `El Service Worker referencia un archivo inexistente: ${file}`); });'
          s=s.replace(old,new); p.write_text(s)
          (root/'tests/update-flow.test.js').write_text('''"use strict";\nconst fs=require("fs"),path=require("path"),root=path.resolve(__dirname,"..");\nconst html=fs.readFileSync(path.join(root,"index.html"),"utf8"),up=fs.readFileSync(path.join(root,"js/update.js"),"utf8"),sw=fs.readFileSync(path.join(root,"sw.js"),"utf8");\nconst checks=[[html.includes("styles.css?v=4.1.4"),"CSS versionado"],[html.includes("js/app.js?v=4.1.4"),"app versionada"],[html.includes('id="update-banner"'),"banner"],[up.includes("updatefound"),"updatefound"],[up.includes("reg.waiting"),"waiting"],[up.includes("SKIP_WAITING"),"skip waiting explícito"],[up.includes("controllerchange"),"controllerchange"],[up.includes("location.reload()"),"recarga"],[sw.includes("abyss404-v4.1.4"),"cache 4.1.4"],[sw.includes('event.data.type === "SKIP_WAITING"'),"mensaje SW"],[!sw.includes('cache.addAll(APP_SHELL)).then(() => self.skipWaiting())'),"sin salto automático"]];\nconst fail=checks.filter(([ok])=>!ok);if(fail.length){fail.forEach(([,x])=>console.error("✗ "+x));process.exit(1)}console.log(`✓ Flujo de actualización verificado (${checks.length} comprobaciones)`);\n''')

          p=root/'README.md'; s=p.read_text().replace('**Versión 4.1.3 — Stable / Definitive**','**Versión 4.1.4 — Stable / Definitive · Update Reliability**').replace('abyss404-v4.1.3','abyss404-v4.1.4')
          if '### Actualización fiable 4.1.4' not in s: s=s.replace('### Mantenimiento final 4.1.3','### Actualización fiable 4.1.4\n\n- Cache-busting en CSS, manifest y módulos JS críticos.\n- Aviso **Nueva versión disponible → Actualizar ahora**.\n- El nuevo Service Worker espera confirmación; al actualizar toma el control y recarga conservando los datos locales.\n- Test automático del flujo de actualización.\n\n### Mantenimiento final 4.1.3')
          p.write_text(s)
          p=root/'CHANGELOG.md'; s=p.read_text()
          if '## 4.1.4 — Update Reliability' not in s: s=s.replace('## 4.1.3','## 4.1.4 — Update Reliability\n\n- Cache-busting de recursos críticos.\n- Aviso de nueva versión con **Actualizar ahora**.\n- Actualización controlada del Service Worker mediante `SKIP_WAITING` y recarga tras `controllerchange`.\n- Nuevo test de regresión del flujo de actualización.\n- Caché `abyss404-v4.1.4`.\n\n## 4.1.3',1)
          p.write_text(s)
          p=root/'AUDIT-REPORT.md'; s=p.read_text().replace('v4.1.3','v4.1.4')
          if '## Update Reliability 4.1.4' not in s: s+='\n\n## Update Reliability 4.1.4\n\nRecursos críticos versionados y actualización visible/controlada del Service Worker con recarga segura y preservación del almacenamiento local.\n'
          p.write_text(s)
          PY
      - name: Test release
        run: npm test
      - name: Commit release
        shell: bash
        run: |
          rm -f .github/workflows/update-4.1.4.yml
          git config user.name "Universe 404 Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: reliable PWA updates in v4.1.4"
          git push
