name: Focus Edition 4.2.0
on:
  push:
    paths:
      - '.github/workflows/focus-4.2.0.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Focus Edition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.')
          p=root/'index.html'; s=p.read_text()
          s=s.replace('data-app-version="4.1.5"','data-app-version="4.2.0"').replace('?v=4.1.5','?v=4.2.0')
          s=s.replace('<span class="save-indicator" id="save-indicator"><i></i> Guardado</span>', '<span class="save-indicator" id="save-indicator"><i></i> Guardado</span>\n          <button class="focus-controls-toggle" id="advanced-controls-toggle" type="button" aria-expanded="false" aria-controls="advanced-game-controls"><span class="focus-controls-toggle__more">Más controles</span><span class="focus-controls-toggle__less">Menos controles</span></button>')
          s=s.replace('<button class="icon-btn" id="context-inspector-btn"', '<button class="icon-btn focus-advanced" id="context-inspector-btn"')
          s=s.replace('<button class="icon-btn" id="export-adventure-btn"', '<button class="icon-btn focus-advanced" id="export-adventure-btn"')
          s=s.replace('<div class="director-strip" aria-label="Dirección narrativa">','<div class="director-strip focus-advanced" id="advanced-game-controls" aria-label="Dirección narrativa">')
          s=s.replace('<p class="director-note" id="director-note">','<p class="director-note focus-advanced" id="director-note">')
          s=s.replace('<div class="trajectory-summary" id="trajectory-summary"','<div class="trajectory-summary focus-advanced" id="trajectory-summary"')
          s=s.replace('<div class="story-toolbar" aria-label="Herramientas de edición">','<div class="story-toolbar focus-advanced" aria-label="Herramientas de edición">')
          for mode in ['story','continue','see']:
              s=s.replace(f'class="mode-tab" type="button" role="tab" aria-selected="false" data-mode="{mode}"',f'class="mode-tab focus-advanced" type="button" role="tab" aria-selected="false" data-mode="{mode}"')
          p.write_text(s)

          p=root/'styles.css'; css=p.read_text()
          focus='''\n\n/* Focus Edition 4.2: the story is primary; advanced machinery remains one click away. */\n.focus-controls-toggle{border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--muted);min-height:38px;padding:.45rem .72rem;border-radius:999px;font:inherit;font-size:.72rem;font-weight:700;letter-spacing:.04em;cursor:pointer;transition:border-color .2s ease,color .2s ease,background .2s ease}\n.focus-controls-toggle:hover,.focus-controls-toggle:focus-visible{border-color:var(--red);color:var(--text);background:rgba(185,35,43,.08)}\n.focus-controls-toggle__less{display:none}\nbody:not(.advanced-controls) .focus-advanced{display:none!important}\nbody.advanced-controls .focus-controls-toggle__more{display:none}\nbody.advanced-controls .focus-controls-toggle__less{display:inline}\nbody:not(.advanced-controls) .objective-card{padding-bottom:1rem}\nbody:not(.advanced-controls) .mode-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}\nbody:not(.advanced-controls) .story-column{max-width:980px;margin-inline:auto;width:100%}\nbody:not(.advanced-controls) .story-feed{font-size:1.02rem;line-height:1.72}\n@media (min-width:1101px){body:not(.advanced-controls) .game-layout{grid-template-columns:minmax(220px,270px) minmax(0,1fr) minmax(210px,250px);gap:1rem}body:not(.advanced-controls) .game-sidebar--right{opacity:.82}}\n@media (max-width:720px){.focus-controls-toggle{min-height:36px;padding:.4rem .62rem;font-size:.68rem}body:not(.advanced-controls) .mode-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}\n'''
          if 'Focus Edition 4.2' not in css: css += focus
          p.write_text(css)

          p=root/'js/app.js'; a=p.read_text()
          insert='''\n  function applyAdvancedControls(enabled, persist = true) {\n    document.body.classList.toggle("advanced-controls", Boolean(enabled));\n    const button = $("#advanced-controls-toggle");\n    if (button) button.setAttribute("aria-expanded", String(Boolean(enabled)));\n    if (persist) { try { localStorage.setItem("abyss404:advanced-controls", enabled ? "1" : "0"); } catch (_) {} }\n    if (!enabled && ["story", "continue", "see"].includes(app.mode)) selectMode("do");\n  }\n\n  function restoreAdvancedControls() {\n    let enabled = false;\n    try { enabled = localStorage.getItem("abyss404:advanced-controls") === "1"; } catch (_) {}\n    applyAdvancedControls(enabled, false);\n  }\n'''
          if 'function applyAdvancedControls' not in a: a=a.replace('  function isInstalledApp() {',insert+'\n  function isInstalledApp() {')
          a=a.replace('    $("#install-app").addEventListener("click", installApp);','    $("#install-app").addEventListener("click", installApp);\n    $("#advanced-controls-toggle").addEventListener("click", () => applyAdvancedControls(!document.body.classList.contains("advanced-controls")));')
          a=a.replace('    bindEvents();\n    window.addEventListener("beforeinstallprompt"','    bindEvents();\n    restoreAdvancedControls();\n    window.addEventListener("beforeinstallprompt"')
          p.write_text(a)

          for fn in ['sw.js','js/update.js']:
              p=root/fn; p.write_text(p.read_text().replace('4.1.5','4.2.0'))

          p=root/'package.json'; data=json.loads(p.read_text()); data['version']='4.2.0'; script=data['scripts']['test']
          if 'tests/focus-edition.test.js' not in script: script=script.replace('node tests/pwa-single-owner.test.js &&','node tests/pwa-single-owner.test.js && node tests/focus-edition.test.js &&')
          data['scripts']['test']=script; p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          for name in ['install-flow.test.js','sw-navigation.test.js','update-flow.test.js']:
              p=root/'tests'/name
              if p.exists(): p.write_text(p.read_text().replace('4.1.5','4.2.0'))
          (root/'tests/focus-edition.test.js').write_text('''"use strict";\nconst fs=require("fs"),path=require("path"),root=path.resolve(__dirname,"..");\nconst html=fs.readFileSync(path.join(root,"index.html"),"utf8"),css=fs.readFileSync(path.join(root,"styles.css"),"utf8"),app=fs.readFileSync(path.join(root,"js/app.js"),"utf8");\nconst checks=[[html.includes('id="advanced-controls-toggle"'),"toggle avanzado"],[html.includes('data-mode="do"')&&html.includes('data-mode="say"'),"Actuar/Hablar"],[(html.match(/focus-advanced/g)||[]).length>=7,"controles avanzados"],[css.includes('body:not(.advanced-controls) .focus-advanced'),"avanzados ocultos"],[css.includes('grid-template-columns:repeat(2'),"dos modos simples"],[app.includes('function applyAdvancedControls'),"control de foco"],[app.includes('function restoreAdvancedControls'),"restauración"],[app.includes('abyss404:advanced-controls'),"persistencia"],[app.includes('["story", "continue", "see"].includes(app.mode)'),"retorno seguro"],[html.includes('data-app-version="4.2.0"'),"versión"]];\nconst bad=checks.filter(([ok])=>!ok);if(bad.length){bad.forEach(([,m])=>console.error('✗ '+m));process.exit(1)}console.log(`✓ Focus Edition verificada (${checks.length} comprobaciones)`);\n''')

          p=root/'README.md'; r=p.read_text(); r=re.sub(r'\*\*Versión [^\n]+\*\*','**Versión 4.2.0 — Focus Edition · Stable / Feature Freeze**',r,count=1)
          if '### Focus Edition 4.2.0' not in r:
              sec='''### Focus Edition 4.2.0\n\n- La experiencia de juego prioriza historia, estado, objetivo y los modos **Actuar / Hablar**.\n- Arco, tensión, nivel, XP, inspector, exportación rápida, herramientas de edición y modos de autor quedan detrás de **Más controles**.\n- Nada se elimina: la preferencia avanzada se conserva localmente.\n- Se reduce el ruido visual sin tocar campañas, finales, continuidad, guardado o PWA.\n- Esta edición entra en **feature freeze**: a partir de aquí, solo correcciones de bugs o compatibilidad.\n\n'''
              r=r.replace('### Estabilización offline 4.1.3',sec+'### Estabilización offline 4.1.3')
          p.write_text(r)
          p=root/'CHANGELOG.md'; c=p.read_text()
          if '## 4.2.0 — Focus Edition' not in c: c='''## 4.2.0 — Focus Edition\n\n- Interfaz de partida simplificada por defecto.\n- Actuar/Hablar como modos primarios; Narrar/Continuar/Visión pasan a controles avanzados.\n- Arco, tensión, nivel, XP, inspector, exportación y edición avanzada quedan detrás de **Más controles**.\n- Preferencia avanzada persistente en localStorage.\n- Documentación/versionado unificados.\n- Feature freeze.\n\n'''+c
          p.write_text(c)
          p=root/'AUDIT-REPORT.md'; ar=p.read_text().replace('v4.1.5','v4.2.0')
          if '## Focus Edition 4.2.0' not in ar: ar+='\n\n## Focus Edition 4.2.0\n\nLa partida prioriza narrativa y acciones principales. Los controles de ingeniería narrativa permanecen disponibles bajo demanda. Se declara feature freeze funcional.\n'
          p.write_text(ar)
          PY
      - name: Test release
        run: npm test
      - name: Commit release
        shell: bash
        run: |
          rm -f .github/workflows/focus-4.2.0.yml
          git config user.name "Universe 404 Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: Focus Edition 4.2.0"
          git push
